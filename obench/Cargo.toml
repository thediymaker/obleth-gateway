[package]
name = "obench"
version = "0.3.5"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "obench"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
ratatui = "0.28"
crossterm = "0.28"
rand = "0.8"
anyhow = "1"

[profile.release]
opt-level = 3
