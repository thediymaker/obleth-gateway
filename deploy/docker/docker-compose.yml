name: obleth

# Modular stack. Core services (postgres, redis, clickhouse, obleth,
# control-plane) have no profile and always start. Optional services are gated
# behind profiles so production can strip them out:
#   benchmark     -> GPU-free benchmark fixture backend
#   mock          -> legacy alias for the benchmark profile
#   edge          -> HAProxy front door (TLS/round-robin; use a real LB in prod)
#   observability -> Prometheus + Grafana + Jaeger (OTLP traces)
#   slurm         -> obleth-provisioner plugin (keeps managed models alive on Slurm)
#   compressor      -> neural prose compression sidecar (bakes ~600 MB ONNX model)
#
# Enable extras via config: add them to COMPOSE_PROFILES in .env (see
# .env.example), then a single `docker compose up -d --build` (run from this
# directory) builds and starts them — no --profile flag needed. You can still
# opt in ad hoc per-command:    docker compose --profile slurm up -d
#
# First-party services declare both image: (published to GHCR by the release
# workflow) and build: (local source). `docker compose pull && up -d` runs the
# published images — pin one with OBLETH_VERSION=vX.Y.Z in .env; developers use
# `docker compose up --build` to build from the working tree instead.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-obleth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/docker/.env (copy from .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-obleth}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-obleth}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    # AUTH is always on: the request path reads API keys from Redis, so an
    # unauthenticated instance would let anyone who reaches it mint keys.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/docker/.env (copy from .env.example)}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/docker/.env}
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      # the image restricts the built-in `default` user to localhost; provision a
      # network-accessible user instead.
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-obleth}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/docker/.env (copy from .env.example)}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-obleth}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:8123:8123", "127.0.0.1:9000:9000"]
    # :9363 Prometheus metrics is scraped in-network by Prometheus (no host bind).
    expose: ["9363"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - "chdata:/var/lib/clickhouse"
      # Built-in Prometheus exposition on :9363/metrics (scraped by Prometheus).
      - "./clickhouse/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  benchmark-backend:
    profiles: ["benchmark", "mock"]
    image: ghcr.io/thediymaker/obleth-gateway/benchmark-backend:${OBLETH_VERSION:-latest}
    build:
      context: ../../benchmark-backend
      dockerfile: ../deploy/docker/benchmark-backend.Dockerfile
    environment:
      BENCHMARK_BACKEND_LISTEN: 0.0.0.0:8081
      BENCHMARK_BACKEND_TTFT_MS: "20"
      BENCHMARK_BACKEND_TOKEN_MS: "3"
      BENCHMARK_BACKEND_CONCURRENCY: "256"   # simulate a saturated cluster to exercise fairshare
    ports: ["8081:8081"]
    networks:
      default:
        aliases:
          - mock-backend

  obleth:
    image: ghcr.io/thediymaker/obleth-gateway/obleth:${OBLETH_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/obleth.Dockerfile
    restart: unless-stopped
    # Room for OBLETH_SHUTDOWN_GRACE_SECS of draining plus the telemetry flush
    # before Docker sends SIGKILL: 300 (grace) + 20 (telemetry drain) + 10
    # (OTLP shutdown) + margin = 345.
    stop_grace_period: 345s
    environment:
      OBLETH_PROXY_LISTEN: 0.0.0.0:8080
      OBLETH_ADMIN_LISTEN: 0.0.0.0:9180
      OBLETH_METRICS_LISTEN: 0.0.0.0:9091
      OBLETH_DATABASE_URL: postgres://${POSTGRES_USER:-obleth}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/docker/.env}@postgres:5432/${POSTGRES_DB:-obleth}
      OBLETH_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/docker/.env}@redis:6379
      OBLETH_REDIS_RESPONSE_TIMEOUT_MS: ${OBLETH_REDIS_RESPONSE_TIMEOUT_MS:-250}
      OBLETH_REDIS_CONNECT_TIMEOUT_MS: ${OBLETH_REDIS_CONNECT_TIMEOUT_MS:-2000}
      OBLETH_REDIS_REWARM_SECS: ${OBLETH_REDIS_REWARM_SECS:-300}
      OBLETH_UPSTREAM_TIMEOUT_SECS: ${OBLETH_UPSTREAM_TIMEOUT_SECS:-300}
      OBLETH_ADMISSION_TIMEOUT_SECS: ${OBLETH_ADMISSION_TIMEOUT_SECS:-60}
      OBLETH_VIDEO_JOB_RETENTION_HOURS: ${OBLETH_VIDEO_JOB_RETENTION_HOURS:-24}
      OBLETH_SESSION_ID_DERIVATION: ${OBLETH_SESSION_ID_DERIVATION:-true}
      # Boot-time seed only; the dashboard's routing settings win once saved.
      OBLETH_AUTO_CLASSIFIER_ENABLED: ${OBLETH_AUTO_CLASSIFIER_ENABLED:-false}
      OBLETH_AUTO_CLASSIFIER_MODEL: ${OBLETH_AUTO_CLASSIFIER_MODEL:-}
      OBLETH_AUTO_CLASSIFIER_TIMEOUT_MS: ${OBLETH_AUTO_CLASSIFIER_TIMEOUT_MS:-250}
      # Empty = the upstream request timeout (OBLETH_UPSTREAM_TIMEOUT_SECS).
      OBLETH_UPSTREAM_READ_TIMEOUT_SECS: ${OBLETH_UPSTREAM_READ_TIMEOUT_SECS:-}
      # Keep below stop_grace_period (below) minus the telemetry flush.
      OBLETH_SHUTDOWN_GRACE_SECS: ${OBLETH_SHUTDOWN_GRACE_SECS:-300}
      OBLETH_CLICKHOUSE_URL: http://clickhouse:8123
      OBLETH_CLICKHOUSE_DB: ${CLICKHOUSE_DB:-obleth}
      OBLETH_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-obleth}
      OBLETH_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in deploy/docker/.env}
      # Upstream LLM endpoint. Defaults to the benchmark fixture backend for dev/demo
      # stack; point this at a real OpenAI-compatible endpoint in production (and run
      # without the `benchmark` profile).
      OBLETH_UPSTREAM_BASE_URL: ${OBLETH_UPSTREAM_BASE_URL:-http://benchmark-backend:8081}
      OBLETH_ADMIN_TOKEN: ${OBLETH_ADMIN_TOKEN:?set OBLETH_ADMIN_TOKEN in deploy/docker/.env (copy from .env.example)}
      # Encrypt upstream secrets at rest (base64 of 32 bytes). Empty = plaintext.
      OBLETH_ENCRYPTION_KEY: ${OBLETH_ENCRYPTION_KEY:-}
      # SSRF: private/LAN/loopback upstreams are allowed by default (local-first).
      # Set OBLETH_BLOCK_PRIVATE_NETWORKS=1 for strict mode; then list trusted
      # internal ranges in OBLETH_ALLOWED_PRIVATE_CIDRS (comma-separated CIDRs).
      OBLETH_BLOCK_PRIVATE_NETWORKS: ${OBLETH_BLOCK_PRIVATE_NETWORKS:-}
      OBLETH_ALLOWED_PRIVATE_CIDRS: ${OBLETH_ALLOWED_PRIVATE_CIDRS:-}
      # Optional server-side pepper mixed into API-key hashes.
      OBLETH_API_KEY_PEPPER: ${OBLETH_API_KEY_PEPPER:-}
      # Trusted JWT issuers for data-plane bearer auth (JSON array). Empty = off.
      # See the "Identity Tokens" guide.
      OBLETH_JWT_ISSUERS: ${OBLETH_JWT_ISSUERS:-}
      OBLETH_GLOBAL_MAX_IN_FLIGHT: "4096"
      OBLETH_DEFAULT_MODEL_MAX_IN_FLIGHT: "32"
      OBLETH_FAIRSHARE_HISTORY_SECS: "3600"
      # Hold fairshare limits across gateway replicas: cluster-wide slots in
      # Redis, divided across replicas when Redis is unreachable. No Redis
      # call on the request path with the single gateway this file runs.
      OBLETH_FAIRSHARE_SHARED_SLOTS: ${OBLETH_FAIRSHARE_SHARED_SLOTS:-true}
      OBLETH_FAIRSHARE_REPLICA_AWARE: ${OBLETH_FAIRSHARE_REPLICA_AWARE:-true}
      OBLETH_FAIRSHARE_REPLICA_HEARTBEAT_SECS: ${OBLETH_FAIRSHARE_REPLICA_HEARTBEAT_SECS:-5}
      OBLETH_FAIRSHARE_REPLICA_TTL_SECS: ${OBLETH_FAIRSHARE_REPLICA_TTL_SECS:-15}
      # Capacity discovery for models in the `discovered` capacity mode. Off by
      # default. The `endpoints` source (a model's own endpoints) works here;
      # the `kubernetes` source needs the gateway to run in a Kubernetes pod,
      # so its namespace list stays empty in this file.
      OBLETH_CAPACITY_DISCOVERY_ENABLED: ${OBLETH_CAPACITY_DISCOVERY_ENABLED:-false}
      OBLETH_CAPACITY_DISCOVERY_INTERVAL_SECS: ${OBLETH_CAPACITY_DISCOVERY_INTERVAL_SECS:-15}
      OBLETH_CAPACITY_DISCOVERY_NAMESPACES: ""
      OBLETH_CAPACITY_DEFAULT_SERVICE: ""
      OBLETH_FAIRSHARE_ALGORITHM: hierarchical
      OBLETH_FAIL_OPEN: "true"
      # Fail-open telemetry WAL: usage batches spill here while ClickHouse is
      # unreachable and replay on recovery. Must be writable by the non-root
      # runtime user (uid 10001); the image's working directory
      # (/var/lib/obleth) and /tmp both are.
      OBLETH_WAL_PATH: ${OBLETH_WAL_PATH:-/tmp/obleth-telemetry.wal}
      OBLETH_MODEL_HEALTH_ENABLED: ${OBLETH_MODEL_HEALTH_ENABLED:-true}
      OBLETH_MODEL_HEALTH_INTERVAL_SECS: ${OBLETH_MODEL_HEALTH_INTERVAL_SECS:-900}
      OBLETH_MODEL_HEALTH_TIMEOUT_SECS: ${OBLETH_MODEL_HEALTH_TIMEOUT_SECS:-30}
      OBLETH_MODEL_HEALTH_RETENTION_DAYS: ${OBLETH_MODEL_HEALTH_RETENTION_DAYS:-30}
      # Days of raw per-request usage history kept before pruning (whole
      # day-partitions are dropped). The permanent daily rollup is never pruned.
      OBLETH_USAGE_RETENTION_DAYS: ${OBLETH_USAGE_RETENTION_DAYS:-180}
      # OTLP/HTTP trace export (base URL). Empty disables tracing; the
      # observability profile ships a Jaeger collector on :4318.
      OBLETH_OTEL_ENDPOINT: ${OBLETH_OTEL_ENDPOINT:-}
      # Optional Slack incoming-webhook alerts. Keep the webhook URL secret.
      OBLETH_SLACK_WEBHOOK_URL: ${OBLETH_SLACK_WEBHOOK_URL:-}
      OBLETH_SLACK_ALERT_MIN_INTERVAL_SECS: ${OBLETH_SLACK_ALERT_MIN_INTERVAL_SECS:-300}
      # Neural prose compression sidecar (optional). Empty = off. Set to
      # http://compressor:8080 and start the `compressor` profile to enable.
      OBLETH_COMPRESSOR_URL: ${OBLETH_COMPRESSOR_URL:-}
      OBLETH_COMPRESSOR_TIMEOUT_MS: ${OBLETH_COMPRESSOR_TIMEOUT_MS:-}
      RUST_LOG: info,obleth=debug
    # host 8088 -> container 8080 (8080 may be taken by other local stacks);
    # internal networking + HAProxy still use 8080.
    ports: ["8088:8080", "127.0.0.1:9180:9180", "127.0.0.1:9091:9091"]
    # No hard dependency on the benchmark fixture service: the upstream is configurable, so obleth
    # must not be coupled to the benchmark fixture. Real deps stay gated on health.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }

  # Optional neural prose compression sidecar. Gated behind the `compressor`
  # profile so it never starts by default (the image bakes a ~600 MB ONNX
  # model). Opt in by adding `compressor` to COMPOSE_PROFILES in .env, then a
  # single `docker compose up -d --build` picks it up. The obleth service
  # calls it when OBLETH_COMPRESSOR_URL is set; it fails open if the sidecar is
  # absent or unreachable, so obleth must NOT depend on this service.
  compressor:
    profiles: ["compressor"]
    # Tagged separately from the other first-party images: the edge build
    # (docker.yml) skips this component because baking the ONNX model is slow,
    # so an edge tag like :dev exists for every image EXCEPT this one. Pinning
    # it independently lets OBLETH_VERSION track edge without breaking the pull
    # here. Release tags (vX.Y.Z, latest) cover all five components, so set
    # OBLETH_COMPRESSOR_VERSION to match OBLETH_VERSION for release deploys.
    image: ghcr.io/thediymaker/obleth-gateway/obleth-compressor:${OBLETH_COMPRESSOR_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/obleth-compressor.Dockerfile
      # Swap the neural model at build time. Defaults bake kompress-v2-base
      # (pre-built ONNX). For LLMLingua-2 set in .env:
      #   COMPRESSOR_SOURCE=export
      #   COMPRESSOR_MODEL_ID=microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank
      args:
        COMPRESSOR_SOURCE: ${COMPRESSOR_SOURCE:-onnx}
        MODEL_ID: ${COMPRESSOR_MODEL_ID:-chopratejas/kompress-v2-base}
        ONNX_FILE: ${COMPRESSOR_ONNX_FILE:-onnx/kompress-fp32.onnx}
    restart: unless-stopped
    # The scorer is CPU-hungry: onnxruntime saturates every core it is allowed on
    # each inference, and throughput is core-bound. This compose stack is meant for
    # dev/testing, so cap it to a small, sane slice — a hard CPU quota AND the
    # matching onnxruntime thread count — rather than letting it monopolize the
    # host. Bump COMPRESSOR_CPUS locally to taste. In production, throughput comes
    # from scaling HORIZONTALLY: many replicas each pinned to N cores behind the
    # Service — see the k8s chart (compressor.replicas / numThreads / resources /
    # autoscaling), not one fat container.
    cpus: ${COMPRESSOR_CPUS:-4}
    environment:
      COMPRESSOR_NUM_THREADS: ${COMPRESSOR_CPUS:-4}
      OMP_NUM_THREADS: ${COMPRESSOR_CPUS:-4}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    expose: ["8080"]

  # Optional Slurm provisioner plugin. NOT part of the core stack: gated behind
  # the `slurm` profile. Opt in by adding `slurm` to COMPOSE_PROFILES in .env
  # (config), then it builds and starts with the same one command as the rest of
  # the stack (`docker compose up -d --build`). It keeps each enabled managed
  # model at its target replica count on a preemptible Slurm cluster via
  # slurmrestd. All cluster specifics are per-model (Management API). The
  # slurmrestd connection details + the master enable switch live in system-wide
  # settings (dashboard → Settings → Slurm), fetched from the Management API each
  # tick — so this service only needs to reach the admin API.
  obleth-provisioner:
    profiles: ["slurm"]
    image: ghcr.io/thediymaker/obleth-gateway/obleth-provisioner:${OBLETH_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/obleth-provisioner.Dockerfile
    restart: unless-stopped
    environment:
      OBLETH_ADMIN_BASE_URL: http://obleth:9180
      OBLETH_ADMIN_TOKEN: ${OBLETH_ADMIN_TOKEN:?set OBLETH_ADMIN_TOKEN in deploy/docker/.env}
      # Self-heal: restart a healthy replica after N net failing health-probe
      # ticks (the counter decays on a pass, so brief flaps on a busy server
      # don't accumulate) while its Slurm job still reports RUNNING (zombie
      # job). 0 disables. Keep the fallback in sync with the binary default in
      # crates/obleth-provisioner/src/config.rs.
      OBLETH_PROVISIONER_RESTART_AFTER_FAILURES: ${OBLETH_PROVISIONER_RESTART_AFTER_FAILURES:-20}
      RUST_LOG: info,obleth_provisioner=debug
    depends_on:
      obleth: { condition: service_started }

  control-plane:
    image: ghcr.io/thediymaker/obleth-gateway/control-plane:${OBLETH_VERSION:-latest}
    build:
      context: ../../control-plane
      dockerfile: ../deploy/docker/control-plane.Dockerfile
    restart: unless-stopped
    environment:
      # Next.js standalone (`node server.js`) binds to $HOSTNAME, which Docker
      # sets to the container ID -> it would listen only on the container's eth0
      # IP and the published host port (3002) could not reach it. Force all
      # interfaces so the host->container port publish works.
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      OBLETH_ADMIN_BASE_URL: http://obleth:9180
      # Data plane (model-test console): reach the gateway's /v1 endpoint in-cluster.
      OBLETH_PROXY_BASE_URL: http://obleth:8080
      OBLETH_ADMIN_TOKEN: ${OBLETH_ADMIN_TOKEN:?set OBLETH_ADMIN_TOKEN in deploy/docker/.env (copy from .env.example)}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in deploy/docker/.env}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:?set DASHBOARD_SESSION_SECRET (>=32 chars) in deploy/docker/.env}
      # Auth DB + OIDC env (better-auth / SSO)
      DATABASE_URL: postgres://${POSTGRES_USER:-obleth}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-obleth}
      BETTER_AUTH_SECRET: ${DASHBOARD_SESSION_SECRET:?set DASHBOARD_SESSION_SECRET (>=32 chars)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3002}
      # Extra origins better-auth trusts for login beyond BETTER_AUTH_URL, so the
      # dashboard is reachable by LAN IP/hostname and not just localhost. See
      # deploy/docker/.env.example ("Accessing the dashboard from another machine").
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      DASHBOARD_ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL:-admin@example.com}
      OIDC_PROVIDERS: ${OIDC_PROVIDERS:-}
    ports: ["3002:3000"]
    depends_on:
      obleth: { condition: service_started }
      postgres: { condition: service_healthy }

  # Local OIDC identity provider for dashboard SSO development. Gated behind
  # the `sso-dev` profile so it never starts in production stacks.
  #
  # The OIDC issuer (host.docker.internal:5556/dex) must resolve to Dex from BOTH
  # the browser AND the control-plane container. The `host.docker.internal`
  # network alias below makes in-network containers resolve that name directly to
  # this Dex container (container-to-container), while the browser resolves it to
  # the host via Docker Desktop's host entry. Dex is also published on host :5556.
  dex:
    profiles: ["sso-dev"]
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.docker.yaml"]
    volumes:
      - ./dex/config.docker.yaml:/etc/dex/config.docker.yaml:ro
    ports: ["5556:5556"]
    networks:
      default:
        aliases:
          - host.docker.internal

  haproxy:
    profiles: ["edge"]
    image: haproxy:3.2
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      # HAProxy expands ${VAR} in haproxy.cfg at parse time; these guard the
      # /stats UI. Defaults keep `docker compose up` working out of the box.
      HAPROXY_STATS_USER: ${HAPROXY_STATS_USER:-admin}
      HAPROXY_STATS_PASSWORD: ${HAPROXY_STATS_PASSWORD:-admin}
    ports: ["80:80"]
    # :8404 (Prometheus metrics + /stats UI) is scraped in-network by Prometheus.
    expose: ["8404"]
    depends_on:
      obleth: { condition: service_started }

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    environment:
      # Anonymous access is OFF: an open dashboard with Admin rights lets anyone
      # on the network edit datasources/dashboards. Log in with the admin user
      # below (password is required from .env, no insecure default).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/docker/.env}
    volumes:
      # Auto-provisioned Prometheus datasource + the bundled dashboards.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on:
      prometheus: { condition: service_started }

  # Postgres -> Prometheus exporter. Reuses the same credentials as the bundled
  # postgres container so it needs no extra setup.
  postgres-exporter:
    profiles: ["observability"]
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-obleth}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/docker/.env}@postgres:5432/${POSTGRES_DB:-obleth}?sslmode=disable
    # Scraped in-network by Prometheus on :9187; no host port needed.
    expose: ["9187"]
    depends_on:
      postgres: { condition: service_healthy }

  # Redis -> Prometheus exporter.
  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/docker/.env}
    # Scraped in-network by Prometheus on :9121; no host port needed.
    expose: ["9121"]
    depends_on:
      redis: { condition: service_healthy }

  # OTLP trace collector + UI. Set OBLETH_OTEL_ENDPOINT=http://jaeger:4317 (see
  # .env.example) so obleth exports spans here. UI on http://localhost:16686.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4317:4317", "127.0.0.1:4318:4318"]

volumes:
  pgdata:
  redisdata:
  chdata:
