global
    log stdout format raw local0
    maxconn 50000

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    # streaming responses: don't buffer
    option http-no-delay

frontend obleth_front
    bind *:80
    default_backend obleth_pods

backend obleth_pods
    balance roundrobin
    # one pod in compose; in prod this is the obleth fleet
    server obleth1 obleth:8080 check
