global
    log stdout format raw local0
    maxconn 50000

# Re-resolve backend hostnames at runtime via Docker's embedded DNS. Without
# this, HAProxy resolves `obleth` once at startup and caches the IP forever, so
# recreating the obleth container (new Docker IP) leaves HAProxy health-checking
# the dead address and serving 503s until it's restarted. In prod this is a
# non-issue: a Kubernetes Service tracks pod IPs natively.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry  1s
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    # streaming responses: don't buffer
    option http-no-delay

frontend obleth_front
    # Plaintext :80 is fine ONLY because this compose file is a reference/dev
    # topology where a managed edge load balancer terminates TLS in front of
    # HAProxy. If HAProxy is ever the internet-facing edge, terminate TLS here
    # instead, e.g. `bind *:443 ssl crt /etc/ssl/private/obleth.pem` plus an
    # `http-request redirect scheme https` on a :80 frontend.
    bind *:80
    default_backend obleth_pods

backend obleth_pods
    balance roundrobin
    # one pod in compose; in prod this is the obleth fleet
    server obleth1 obleth:8080 check resolvers docker init-addr last,libc,none

# Built-in Prometheus exporter (+ human stats page) for the observability stack.
# Prometheus scrapes :8404/metrics; browse :8404/stats for the live HAProxy UI.
frontend stats
    bind *:8404
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    # The :8404 frontend is only `expose`d to the in-Docker network (Prometheus
    # scrapes /metrics), not published to the host. Require credentials on the
    # human /stats UI anyway as defense-in-depth in case the port is ever mapped.
    stats realm obleth\ stats
    stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASSWORD}
