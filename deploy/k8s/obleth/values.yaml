image:
  obleth: ghcr.io/thediymaker/obleth-gateway/obleth
  benchmarkBackend: ghcr.io/thediymaker/obleth-gateway/benchmark-backend
  controlPlane: ghcr.io/thediymaker/obleth-gateway/control-plane
  # Empty -> v{appVersion} from Chart.yaml, so each chart release pins its own
  # images. Override to test a specific tag (e.g. "main" for edge builds).
  tag: ""
  pullPolicy: IfNotPresent

obleth:
  replicas: 3
  globalMaxInFlight: 256
  failOpen: true
  # REQUIRED. No default is shipped — supply via `--set obleth.adminToken=...`,
  # a values override, or (preferred) an external Secret. `openssl rand -hex 32`.
  adminToken: ""
  # Encrypt upstream secrets at rest (model api_key, MCP auth_header). Base64 of
  # 32 random bytes (`openssl rand -base64 32`). Empty = plaintext storage.
  # Supply via an external Secret in production.
  encryptionKey: ""
  # Optional server-side pepper mixed into API-key hashes. Keep secret/stable;
  # changing it invalidates issued keys. Supply via an external Secret.
  apiKeyPepper: ""
  # PRODUCTION: reference a pre-created Secret instead of letting the chart
  # build one from the values above (so real secrets never touch values files or
  # --set/CLI history). When set, the chart does NOT render its own Secret and
  # the named Secret MUST provide every key the chart would have: OBLETH_ADMIN_TOKEN,
  # OBLETH_DATABASE_URL, OBLETH_CLICKHOUSE_PASSWORD, OBLETH_ENCRYPTION_KEY,
  # OBLETH_API_KEY_PEPPER, OBLETH_SLACK_WEBHOOK_URL. See examples/values-production.yaml.
  existingSecret: ""
  # SSRF allowlist for admin-registered upstream URLs (comma-separated CIDRs).
  # Default SSRF policy permits private/LAN targets (RFC1918, loopback, etc.) so
  # in-cluster api_base values work without this field. Only required when
  # OBLETH_BLOCK_PRIVATE_NETWORKS=1 (strict mode) — then list trusted ranges,
  # e.g. "10.0.0.0/8".
  allowedPrivateCidrs: ""
  upstreamBaseUrl: ""   # empty -> defaults to the in-chart benchmark fixture backend
  # OTLP trace export endpoint (e.g. http://my-collector:4317). Empty disables.
  otelEndpoint: ""
  # Slack incoming-webhook alerts. Keep the webhook URL in an external Secret
  # for production chart values.
  slackWebhookUrl: ""
  slackAlertMinIntervalSecs: 300
  modelHealthEnabled: true
  modelHealthIntervalSecs: 900
  modelHealthTimeoutSecs: 30
  modelHealthRetentionDays: 30
  usageRetentionDays: 180
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "2", memory: "1Gi" }

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

# Pod- and container-level hardening applied to the stateless workloads this
# chart builds (obleth data plane, control-plane, benchmark-backend). These
# defaults satisfy the Kubernetes "restricted" Pod Security Standard. UID is NOT
# pinned here because the images run as different non-root users (obleth=10001,
# control-plane=1000); runAsNonRoot enforces non-root without hardcoding a UID.
# The bundled datastores are intentionally excluded — their official images
# manage their own users (e.g. the Postgres entrypoint must start as root).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  # readOnlyRootFilesystem is opt-in: enable per environment only after
  # confirming nothing writes to the container rootfs (Next.js may need /tmp).
  # readOnlyRootFilesystem: true

# Spread obleth replicas across nodes so a single node failure cannot take the
# whole data plane down. "soft" prefers spreading but still schedules on a
# single-node cluster; "hard" requires distinct nodes (won't schedule more
# replicas than nodes); "" disables.
affinity:
  antiAffinity: soft

# Keep a minimum number of obleth pods available during voluntary disruptions
# (node drains, rolling upgrades). Only rendered when replicas/HPA allow it.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Optional NetworkPolicy that restricts the bundled datastore ports to obleth
# pods only. Off by default (requires a CNI that enforces NetworkPolicy). Has no
# effect on external datastores.
networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false   # set true if the Prometheus Operator CRDs are installed

# Optional Ingress (HAProxy's role in the Docker stack). Disabled by default;
# enable and set host/className to expose the obleth proxy through a cluster LB.
ingress:
  enabled: false
  className: ""
  host: obleth.example.com
  # Service port to route to: proxy (8080) for the data plane.
  servicePort: 8080
  annotations: {}
  tls: []   # e.g. [{ secretName: obleth-tls, hosts: [obleth.example.com] }]

# Bundled dependencies for a self-contained install. In production, prefer the
# CloudNativePG operator (Postgres), a managed/operator ClickHouse, and a real
# Redis (the data plane treats Redis as a hot cache, so HA Redis is recommended).
#
# Three storage scenarios are supported per datastore:
#   1. Persistent (default): `persistence.enabled: true` provisions a PVC so data
#      survives pod restarts/reschedules. Requires a StorageClass in the cluster.
#   2. Ephemeral (test only): `persistence.enabled: false` uses an emptyDir —
#      ALL DATA IS LOST when the pod restarts. Use only for throwaway test envs.
#   3. External: `enabled: false` + `external.url` points obleth at a managed or
#      self-hosted datastore and the bundled container is not deployed at all.
postgres:
  enabled: true
  image: postgres:16
  user: obleth
  # REQUIRED when postgres.enabled=true. Supply via --set or an external Secret.
  password: ""
  db: obleth
  # PVC-backed storage for the bundled Postgres. Disable for ephemeral test envs
  # (data is lost on restart). Postgres is the config source of truth — keep this
  # enabled for anything you care about.
  persistence:
    enabled: true
    size: 10Gi
    # "" uses the cluster's default StorageClass. Set a name to pin one.
    storageClass: ""
    accessMode: ReadWriteOnce
  external:
    # Full connection URL used when enabled=false, e.g.
    # postgres://user:pass@my-pg-host:5432/obleth
    url: ""

redis:
  enabled: true
  image: redis:7
  # PVC-backed AOF persistence. Redis is a rebuildable hot cache, so this is
  # optional — disable for ephemeral test envs. obleth re-warms from Postgres if
  # Redis data is lost.
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  external:
    # e.g. redis://my-redis-host:6379
    url: ""

clickhouse:
  enabled: true
  image: clickhouse/clickhouse-server:24.8
  db: obleth
  user: obleth
  # REQUIRED when clickhouse.enabled=true. Supply via --set or an external Secret.
  password: ""
  # PVC-backed storage for the usage ledger. Disable for ephemeral test envs
  # (usage history is lost on restart).
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  external:
    # e.g. http://my-clickhouse-host:8123
    url: ""

benchmarkBackend:
  enabled: true
  ttftMs: 20
  tokenMs: 3
  concurrency: 256

controlPlane:
  enabled: true
  replicas: 1
  # Dashboard login. All REQUIRED (no defaults shipped) — supply via --set or an
  # external Secret. dashboardSessionSecret MUST be at least 32 characters.
  dashboardUsername: admin
  dashboardPassword: ""
  dashboardSessionSecret: ""
  # PRODUCTION: reference a pre-created Secret instead of inlining the dashboard
  # credentials. When set, the chart does NOT render its own control-plane
  # Secret; the named Secret MUST provide DASHBOARD_USERNAME, DASHBOARD_PASSWORD,
  # and DASHBOARD_SESSION_SECRET.
  existingSecret: ""
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
