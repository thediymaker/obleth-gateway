apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obleth.fullname" . }}
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.obleth.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: obleth
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obleth
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Rolls the gateway when the chart-rendered Secret changes. Constant
        # when obleth.existingSecret is set (restart manually in that mode).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Room for a 300s streaming response plus shutdown headroom before the
      # pod is killed during a rollout or drain: shutdownGraceSecs (300) + 20s
      # telemetry drain + 10s OTLP shutdown + margin. See values.yaml's
      # obleth.shutdownGraceSecs comment before changing either number.
      terminationGracePeriodSeconds: 345
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if include "obleth.capacityDiscoveryRbac" . }}
      # The kubernetes capacity source reads pods with this account's token
      # (see templates/capacity-discovery-rbac.yaml).
      serviceAccountName: {{ include "obleth.fullname" . }}
      automountServiceAccountToken: true
      {{- end }}
      {{- include "obleth.antiAffinity" . | nindent 6 }}
      {{- with .Values.nodeResolution.hostAliases }}
      hostAliases: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeResolution.dnsConfig }}
      dnsConfig: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeResolution.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      containers:
        - name: obleth
          image: {{ .Values.image.obleth }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: proxy, containerPort: 8080 }
            - { name: admin, containerPort: 9180 }
            - { name: metrics, containerPort: 9091 }
          env:
            - { name: OBLETH_PROXY_LISTEN, value: "0.0.0.0:8080" }
            - { name: OBLETH_ADMIN_LISTEN, value: "0.0.0.0:9180" }
            - { name: OBLETH_METRICS_LISTEN, value: "0.0.0.0:9091" }
            - { name: OBLETH_CLICKHOUSE_URL, value: {{ include "obleth.clickhouseUrl" . | quote }} }
            - { name: OBLETH_CLICKHOUSE_DB, value: {{ .Values.clickhouse.db | quote }} }
            - { name: OBLETH_CLICKHOUSE_USER, value: {{ .Values.clickhouse.user | quote }} }
            - { name: OBLETH_UPSTREAM_BASE_URL, value: {{ include "obleth.upstream" . | quote }} }
            - { name: OBLETH_GLOBAL_MAX_IN_FLIGHT, value: {{ .Values.obleth.globalMaxInFlight | quote }} }
            - { name: OBLETH_DEFAULT_MODEL_MAX_IN_FLIGHT, value: {{ .Values.obleth.defaultModelMaxInFlight | quote }} }
            - { name: OBLETH_FAIRSHARE_HISTORY_SECS, value: {{ .Values.obleth.fairshareHistorySecs | quote }} }
            - { name: OBLETH_FAIRSHARE_REPLICA_AWARE, value: {{ .Values.obleth.fairshareReplicaAware | quote }} }
            - { name: OBLETH_FAIRSHARE_REPLICA_HEARTBEAT_SECS, value: {{ .Values.obleth.fairshareReplicaHeartbeatSecs | quote }} }
            - { name: OBLETH_FAIRSHARE_REPLICA_TTL_SECS, value: {{ .Values.obleth.fairshareReplicaTtlSecs | quote }} }
            - { name: OBLETH_CAPACITY_DISCOVERY_ENABLED, value: {{ .Values.obleth.capacityDiscovery.enabled | quote }} }
            - { name: OBLETH_CAPACITY_DISCOVERY_INTERVAL_SECS, value: {{ .Values.obleth.capacityDiscovery.intervalSecs | quote }} }
            - { name: OBLETH_CAPACITY_DISCOVERY_NAMESPACES, value: {{ join "," (uniq .Values.obleth.capacityDiscovery.namespaces) | quote }} }
            - { name: OBLETH_CAPACITY_DEFAULT_SELECTOR, value: {{ .Values.obleth.capacityDiscovery.defaultSelector | quote }} }
            - { name: OBLETH_FAIL_OPEN, value: {{ .Values.obleth.failOpen | quote }} }
            - { name: OBLETH_ALLOWED_PRIVATE_CIDRS, value: {{ .Values.obleth.allowedPrivateCidrs | quote }} }
            - { name: OBLETH_MODEL_HEALTH_ENABLED, value: {{ .Values.obleth.modelHealthEnabled | quote }} }
            - { name: OBLETH_MODEL_HEALTH_INTERVAL_SECS, value: {{ .Values.obleth.modelHealthIntervalSecs | quote }} }
            - { name: OBLETH_MODEL_HEALTH_TIMEOUT_SECS, value: {{ .Values.obleth.modelHealthTimeoutSecs | quote }} }
            - { name: OBLETH_MODEL_HEALTH_RETENTION_DAYS, value: {{ .Values.obleth.modelHealthRetentionDays | quote }} }
            - { name: OBLETH_USAGE_RETENTION_DAYS, value: {{ .Values.obleth.usageRetentionDays | quote }} }
            - { name: OBLETH_OTEL_ENDPOINT, value: {{ .Values.obleth.otelEndpoint | quote }} }
            - { name: OBLETH_SLACK_ALERT_MIN_INTERVAL_SECS, value: {{ .Values.obleth.slackAlertMinIntervalSecs | quote }} }
            - { name: OBLETH_SHUTDOWN_GRACE_SECS, value: {{ .Values.obleth.shutdownGraceSecs | quote }} }
            - { name: OBLETH_REDIS_REWARM_SECS, value: {{ .Values.obleth.redisRewarmSecs | quote }} }
            - { name: OBLETH_UPSTREAM_TIMEOUT_SECS, value: {{ .Values.obleth.upstreamTimeoutSecs | quote }} }
            - { name: OBLETH_UPSTREAM_READ_TIMEOUT_SECS, value: {{ .Values.obleth.upstreamReadTimeoutSecs | quote }} }
            - { name: OBLETH_REDIS_RESPONSE_TIMEOUT_MS, value: {{ .Values.obleth.redisResponseTimeoutMs | quote }} }
            - { name: OBLETH_REDIS_CONNECT_TIMEOUT_MS, value: {{ .Values.obleth.redisConnectTimeoutMs | quote }} }
            - { name: OBLETH_ADMISSION_TIMEOUT_SECS, value: {{ .Values.obleth.admissionTimeoutSecs | quote }} }
            - { name: OBLETH_VIDEO_JOB_RETENTION_HOURS, value: {{ .Values.obleth.videoJobRetentionHours | quote }} }
            # Telemetry spill file used while ClickHouse is unreachable. Must be
            # writable by the non-root runtime user; backed by the wal volume.
            - { name: OBLETH_WAL_PATH, value: "/var/lib/obleth/telemetry.wal" }
            {{- if .Values.compressor.enabled }}
            - { name: OBLETH_COMPRESSOR_URL, value: "http://{{ .Release.Name }}-compressor:8080" }
            {{- end }}
            - { name: RUST_LOG, value: "info,obleth=info" }
          envFrom:
            - secretRef:
                name: {{ include "obleth.secretName" . }}
          volumeMounts:
            - { name: wal, mountPath: /var/lib/obleth }
          # SIGTERM makes the gateway stop accepting at once, but endpoint
          # removal reaches Services and ingresses a moment later; the delay
          # keeps new connections from being refused during that window.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # Boot runs migrations and warms Redis before /health answers; the
          # startup probe allows up to 150s before liveness takes over.
          startupProbe:
            httpGet: { path: /health, port: proxy }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: proxy }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: proxy }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.obleth.resources | nindent 12 }}
      volumes:
        # Per-pod telemetry WAL. Spilled records survive container restarts but
        # not pod deletion; replay runs once ClickHouse is reachable again.
        - name: wal
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "obleth.fullname" . }}
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: obleth
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: proxy, port: 8080, targetPort: proxy }
    - { name: admin, port: 9180, targetPort: admin }
    - { name: metrics, port: 9091, targetPort: metrics }
{{- /* Only when the effective minimum replica count is > 1: a PDB over a single
pod with minAvailable 1 would block node drains indefinitely. */}}
{{- $minReplicas := int .Values.obleth.replicas }}
{{- if .Values.hpa.enabled }}{{ $minReplicas = int .Values.hpa.minReplicas }}{{ end }}
{{- if and .Values.podDisruptionBudget.enabled (gt $minReplicas 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "obleth.fullname" . }}
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: obleth
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- if .Values.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "obleth.fullname" . }}
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "obleth.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "obleth.fullname" . }}
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obleth
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: metrics
      interval: 5s
{{- end }}
