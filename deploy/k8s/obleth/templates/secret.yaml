{{- /* The obleth Secret. Kept in its own template so workloads that read it can
carry a checksum/secret annotation (sha256 of this file) and roll on change. */}}
{{- if not .Values.obleth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "obleth.fullname" . }}-secret
  labels: {{- include "obleth.labels" . | nindent 4 }}
type: Opaque
stringData:
  OBLETH_ADMIN_TOKEN: {{ required "obleth.adminToken is required: set a strong token (via --set or an external Secret); do not commit a real value" .Values.obleth.adminToken | quote }}
  OBLETH_DATABASE_URL: {{ include "obleth.databaseUrl" . | quote }}
  # Carries the Redis password, so it lives here rather than in a plain env value.
  OBLETH_REDIS_URL: {{ include "obleth.redisUrl" . | quote }}
  {{- if .Values.clickhouse.enabled }}
  OBLETH_CLICKHOUSE_PASSWORD: {{ required "clickhouse.password is required when clickhouse.enabled=true (set via --set or an external Secret)" .Values.clickhouse.password | quote }}
  {{- else }}
  OBLETH_CLICKHOUSE_PASSWORD: {{ .Values.clickhouse.password | quote }}
  {{- end }}
  OBLETH_SLACK_WEBHOOK_URL: {{ .Values.obleth.slackWebhookUrl | quote }}
  OBLETH_ENCRYPTION_KEY: {{ .Values.obleth.encryptionKey | quote }}
  OBLETH_API_KEY_PEPPER: {{ .Values.obleth.apiKeyPepper | quote }}
  OBLETH_JWT_ISSUERS: {{ .Values.obleth.jwtIssuers | quote }}
  {{- /* Read by the bundled datastore containers via secretKeyRef (deps.yaml). */}}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required (set via --set or an external Secret)" .Values.postgres.password | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_PASSWORD: {{ required "redis.password is required when redis.enabled=true (set via --set or an external Secret)" .Values.redis.password | quote }}
  {{- end }}
{{- end }}
