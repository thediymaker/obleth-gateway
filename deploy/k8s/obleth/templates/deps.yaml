{{- if .Values.postgres.enabled }}
{{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.postgres.persistence.accessMode | quote }}]
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
  {{- with .Values.postgres.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Recreate avoids a second pod attaching the same RWO PVC during a rollout.
  strategy:
    type: Recreate
  selector: { matchLabels: { app: {{ .Release.Name }}-postgres } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-postgres } }
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ required "postgres.password is required (set via --set or an external Secret)" .Values.postgres.password | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgres.db | quote }} }
            # Keep data in a subdirectory so a freshly provisioned volume's
            # lost+found entry does not block Postgres init.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes:
        - name: data
        {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-postgres
        {{- else }}
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-postgres }
spec:
  selector: { app: {{ .Release.Name }}-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
{{- end }}
{{- if .Values.redis.enabled }}
---
{{- if .Values.redis.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.redis.persistence.accessMode | quote }}]
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size | quote }}
  {{- with .Values.redis.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: {{ .Release.Name }}-redis } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-redis } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
        {{- if .Values.redis.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-redis
        {{- else }}
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-redis }
spec:
  selector: { app: {{ .Release.Name }}-redis }
  ports: [{ port: 6379, targetPort: 6379 }]
{{- end }}
{{- if .Values.clickhouse.enabled }}
---
{{- if .Values.clickhouse.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-clickhouse
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.clickhouse.persistence.accessMode | quote }}]
  resources:
    requests:
      storage: {{ .Values.clickhouse.persistence.size | quote }}
  {{- with .Values.clickhouse.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clickhouse
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: {{ .Release.Name }}-clickhouse } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-clickhouse } }
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          env:
            - { name: CLICKHOUSE_USER, value: {{ .Values.clickhouse.user | quote }} }
            - { name: CLICKHOUSE_PASSWORD, value: {{ required "clickhouse.password is required (set via --set or an external Secret)" .Values.clickhouse.password | quote }} }
            - { name: CLICKHOUSE_DB, value: {{ .Values.clickhouse.db | quote }} }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          ports: [{ containerPort: 8123 }, { containerPort: 9000 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/clickhouse }]
      volumes:
        - name: data
        {{- if .Values.clickhouse.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-clickhouse
        {{- else }}
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-clickhouse }
spec:
  selector: { app: {{ .Release.Name }}-clickhouse }
  ports: [{ name: http, port: 8123, targetPort: 8123 }, { name: native, port: 9000, targetPort: 9000 }]
{{- end }}
{{- if .Values.benchmarkBackend.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-benchmark-backend
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector: { matchLabels: { app: {{ .Release.Name }}-benchmark-backend } }
  template:
    metadata: { labels: { app: {{ .Release.Name }}-benchmark-backend } }
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: benchmark-backend
          image: {{ .Values.image.benchmarkBackend }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - { name: BENCHMARK_BACKEND_LISTEN, value: "0.0.0.0:8081" }
            - { name: BENCHMARK_BACKEND_TTFT_MS, value: {{ .Values.benchmarkBackend.ttftMs | quote }} }
            - { name: BENCHMARK_BACKEND_TOKEN_MS, value: {{ .Values.benchmarkBackend.tokenMs | quote }} }
            - { name: BENCHMARK_BACKEND_CONCURRENCY, value: {{ .Values.benchmarkBackend.concurrency | quote }} }
          ports: [{ containerPort: 8081 }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-benchmark-backend }
spec:
  selector: { app: {{ .Release.Name }}-benchmark-backend }
  ports: [{ port: 8081, targetPort: 8081 }]
{{- end }}
