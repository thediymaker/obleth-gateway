{{- if .Values.compressor.enabled }}
# Optional neural prose compression sidecar. Serves POST /score + GET /health
# on port 8080. The obleth data plane calls it when OBLETH_COMPRESSOR_URL is
# set; if absent or unreachable the gateway falls back to a built-in heuristic
# (fail-open). Enable via compressor.enabled=true in your values override; the
# image bakes a ~600 MB ONNX model so builds are slow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-compressor
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  {{- if not .Values.compressor.autoscaling.enabled }}
  replicas: {{ .Values.compressor.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-compressor
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-compressor
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: compressor
          image: {{ .Values.compressor.image.repository }}:{{ .Values.compressor.image.tag | default (printf "v%s" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.compressor.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources: {{- toYaml .Values.compressor.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-compressor
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-compressor
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if .Values.compressor.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-compressor
  labels: {{- include "obleth.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-compressor
  minReplicas: {{ .Values.compressor.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.compressor.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.compressor.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
