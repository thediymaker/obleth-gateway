# Capacity discovery: pool sizes that follow the backend
# -----------------------------------------------------------------------------
# Layer this on top of any other profile (-f values-production.yaml -f this).
# It only matters for models whose capacity mode is `discovered`; every other
# model keeps its static max_in_flight. See the README's "Capacity discovery"
# section for the formula and the fallbacks.
#
# The `endpoints` source (a model's own registered endpoints) needs nothing
# below except `enabled`. The `kubernetes` source counts the ready endpoints
# of each model's Service and needs `namespaces`: for each one the chart
# creates a Role that can only get/list/watch endpointslices
# (discovery.k8s.io), bound to a ServiceAccount it creates for the gateway.
# That reveals only Service endpoint addresses and readiness; nothing on pods,
# Services or Secrets is granted.
#
# Replica counts are all the gateway reads. Each discovered model sets its
# per-replica concurrency once, as `per_replica_max_in_flight` (e.g. your
# server's max concurrent sequences, such as vLLM --max-num-seqs).

obleth:
  capacityDiscovery:
    enabled: true
    intervalSecs: 15
    # Where the Services live. A model that sets no capacity_namespace is
    # looked up in these in order; the first namespace that has its Service
    # wins.
    namespaces:
      - inference
    # Used for kubernetes-source models that set no capacity_service.
    # {upstream_model} and {model_name} are filled in per model; the result
    # must be a valid Service name as is (lowercase letters, digits and '-').
    # This one fits Services named after the model they serve:
    defaultService: "{upstream_model}"

    # Other examples (use one, adjust to your naming):
    #
    # A Service per gateway model name, with a suffix:
    #   defaultService: "{model_name}-serve"
    #
    # Leave it empty to make every kubernetes-source model name its own
    # Service:
    #   defaultService: ""
    #
    # Multi-node serving, where only some pods (for example a leader or head
    # pod) take requests: point the model at a Service whose selector matches
    # just those pods, and the count follows them.
