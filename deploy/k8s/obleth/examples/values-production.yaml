# Scenario 4: PRODUCTION — external datastores + full workload hardening
# -----------------------------------------------------------------------------
# The recommended topology for production install:
#
#   * obleth runs ONLY its stateless workloads (data plane + control plane).
#   * Postgres, Redis, and ClickHouse are operated OUTSIDE this chart by
#     purpose-built tooling that gives you backups, HA, and PITR:
#       - Postgres   : CloudNativePG operator (or a managed cloud Postgres)
#       - ClickHouse : Altinity ClickHouse operator (or managed ClickHouse)
#       - Redis      : a real HA Redis (operator/managed) — obleth treats Redis
#                      as a hot cache and re-warms from Postgres, but HA avoids
#                      cold-start latency spikes.
#   * Secrets are sourced from PRE-CREATED Kubernetes Secrets (existingSecret),
#     so real credentials never touch values files, git, or --set/CLI history.
#   * The data plane runs 3 replicas, spread across nodes (anti-affinity) and
#     protected by a PodDisruptionBudget, with the fairshare limits divided
#     across them through Redis heartbeats (see obleth below).
#
# -----------------------------------------------------------------------------
# 1. Create the Secrets out-of-band (example — use your secrets manager / SOPS /
#    External Secrets Operator instead of raw kubectl in production):
#
#    kubectl create secret generic obleth-secrets -n obleth \
#      --from-literal=OBLETH_ADMIN_TOKEN="$(openssl rand -hex 32)" \
#      --from-literal=OBLETH_DATABASE_URL="postgres://obleth:PASS@pg-rw.db.svc:5432/obleth" \
#      --from-literal=OBLETH_REDIS_URL="redis://:PASS@redis-master.db.svc:6379" \
#      --from-literal=OBLETH_CLICKHOUSE_PASSWORD="CLICKHOUSE_PASS" \
#      --from-literal=OBLETH_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#      --from-literal=OBLETH_API_KEY_PEPPER="$(openssl rand -hex 32)" \
#      --from-literal=OBLETH_SLACK_WEBHOOK_URL="" \
#      --from-literal=OBLETH_JWT_ISSUERS=""
#    OBLETH_JWT_ISSUERS is optional: a JSON array of trusted issuers for the
#    data-plane JWT bearer path (see the "Identity Tokens" guide). Empty/unset
#    disables the JWT path entirely; the two lines above still cover every key
#    the chart would otherwise render.
#
#    With existingSecret set, the chart renders NO control-plane Secret, so this
#    Secret MUST carry every key the dashboard needs — including the auth DB and
#    SSO keys. DASHBOARD_SESSION_SECRET doubles as BETTER_AUTH_SECRET if the
#    latter is omitted. Leave OIDC_PROVIDERS out (or empty) to run break-glass-only.
#    kubectl create secret generic obleth-control-plane -n obleth \
#      --from-literal=DASHBOARD_ADMIN_EMAIL="admin@your-org.example" \
#      --from-literal=DASHBOARD_PASSWORD="$(openssl rand -hex 16)" \
#      --from-literal=DASHBOARD_SESSION_SECRET="$(openssl rand -hex 32)" \
#      --from-literal=DATABASE_URL="postgres://obleth:PASS@pg-rw.db.svc:5432/obleth" \
#      --from-literal=BETTER_AUTH_URL="https://dashboard.example.com" \
#      --from-literal=OIDC_PROVIDERS='[{"providerId":"globus","displayName":"Globus","discoveryUrl":"https://auth.globus.org/.well-known/openid-configuration","clientId":"ID","clientSecret":"SECRET","scopes":["openid","email","profile"]}]'
#
# 2. Install:
#    helm install obleth ./deploy/k8s/obleth -n obleth --create-namespace \
#      -f deploy/k8s/obleth/examples/values-production.yaml
# -----------------------------------------------------------------------------

obleth:
  # Three replicas for redundancy. Fairshare runs one pool per model (default
  # 32 slots via defaultModelMaxInFlight, or the model's own max_in_flight);
  # globalMaxInFlight is a total ceiling across those pools, not a fairness
  # input. Both are fleet-wide: each replica enforces ceil(value / 3) of them
  # (fairshareReplicaAware, the default). 256 covers seven concurrently active
  # models at the default pool size (each replica holds 86 of the ceiling
  # against 11 per pool); raise it if you register more. Replicas cannot lend
  # each other idle capacity, so fairness is exact only when the Service
  # spreads requests evenly.
  replicas: 3
  globalMaxInFlight: 256
  # All credentials come from the pre-created Secret above; no secret values are
  # set inline. The Secret MUST contain every key listed in step 1.
  existingSecret: obleth-secrets
  upstreamBaseUrl: "https://my-vllm-or-aibrix-endpoint/v1"
  # If your external datastores sit on private/LAN addresses AND you enable
  # strict SSRF (OBLETH_BLOCK_PRIVATE_NETWORKS=1), allow those ranges here.
  allowedPrivateCidrs: ""
  otelEndpoint: ""   # e.g. http://otel-collector.observability.svc:4317

# External, operator-managed datastores — nothing stateful runs in this chart.
postgres:
  enabled: false
  external:
    # Used only to satisfy chart rendering; the live URL comes from the Secret's
    # OBLETH_DATABASE_URL above. Keep them consistent.
    url: "postgres://obleth:PASS@pg-rw.db.svc:5432/obleth"

redis:
  enabled: false
  external:
    # Used only to satisfy chart rendering; the live URL comes from the
    # Secret's OBLETH_REDIS_URL above. Keep them consistent.
    url: "redis://:PASS@redis-master.db.svc:6379"

clickhouse:
  enabled: false
  user: obleth
  db: obleth
  # Password is supplied via the Secret (OBLETH_CLICKHOUSE_PASSWORD); left empty
  # here so it is never inlined.
  password: ""
  external:
    url: "http://clickhouse.db.svc:8123"

# No demo fixture backend in production.
benchmarkBackend:
  enabled: false

# Stateless data plane: spread across nodes and protected against disruptions.
#
# Autoscaling is safe to turn on: replicas divide the fairshare limits between
# them, so scaling changes gateway CPU, not the concurrency reaching the
# upstream. It stays off here so the example's capacity is predictable; when
# enabling it, keep globalMaxInFlight at least one slot per enabled model per
# replica (at maxReplicas) above the pool sum, since each pool's share rounds
# up.
hpa:
  enabled: false
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

affinity:
  antiAffinity: soft   # use "hard" on multi-node clusters to require distinct nodes

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Restricted-PSS security contexts are on by default; nothing to set here.
# Enable NetworkPolicy only if a CNI enforces it (no bundled deps to gate, but
# harmless to leave off for external datastores).
networkPolicy:
  enabled: false

serviceMonitor:
  enabled: true   # requires the Prometheus Operator CRDs

controlPlane:
  enabled: true
  replicas: 2
  existingSecret: obleth-control-plane
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }

# Expose the data plane through your ingress controller with TLS.
ingress:
  enabled: true
  className: nginx
  host: obleth.example.com
  servicePort: 8080
  tls:
    - secretName: obleth-tls
      hosts: [obleth.example.com]
