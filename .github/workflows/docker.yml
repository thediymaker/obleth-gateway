name: docker-edge

# Every push to main or dev builds amd64 images and moves the tag named after
# the branch (:main, :dev). This keeps the Docker build path continuously
# exercised (release day is never the first time the Dockerfiles build) and
# gives users a way to test unreleased fixes. Integration happens on dev, so
# :dev is the moving edge and :main tracks what has been promoted for release.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/thediymaker/obleth-gateway

jobs:
  edge:
    strategy:
      matrix:
        component: [obleth, obleth-provisioner, control-plane, benchmark-backend]
        include:
          - component: obleth
            context: .
          - component: obleth-provisioner
            context: .
          - component: control-plane
            context: ./control-plane
          - component: benchmark-backend
            context: ./benchmark-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: edge-${{ matrix.component }}-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.component }}:${{ github.ref_name }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-amd64
