name: docker-edge

# Every push to main builds amd64 images and moves the :main tag. This keeps
# the Docker build path continuously exercised (release day is never the first
# time the Dockerfiles build) and gives users a way to test unreleased fixes.
on:
  push:
    branches: [main]

permissions:
  packages: write

env:
  REGISTRY: ghcr.io/thediymaker/obleth-gateway

jobs:
  edge:
    strategy:
      matrix:
        component: [obleth, obleth-provisioner, control-plane, benchmark-backend]
        include:
          - component: obleth
            context: .
          - component: obleth-provisioner
            context: .
          - component: control-plane
            context: ./control-plane
          - component: benchmark-backend
            context: ./benchmark-backend
    runs-on: ubuntu-latest
    concurrency:
      group: edge-${{ matrix.component }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.component }}:main
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-amd64
