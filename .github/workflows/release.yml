name: release

# Pushing a vX.Y.Z tag publishes everything in lockstep: multi-arch images for
# the three components to GHCR, the Helm chart as an OCI artifact, and a
# GitHub Release. Prerelease tags (vX.Y.Z-rc.N) publish images + chart but
# skip the :latest tag and mark the release as a prerelease.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/thediymaker/obleth-gateway

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches lockstep version
        run: bash scripts/check-versions.sh "$GITHUB_REF_NAME"

  build:
    needs: verify
    strategy:
      matrix:
        component: [obleth, obleth-provisioner, control-plane, benchmark-backend, obleth-kompress]
        # Native runners for both arches — never QEMU (Rust under emulation
        # takes 30-60 min per image).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - component: obleth
            context: .
          # The provisioner Dockerfile expects the repo root as its build context
          # (same as obleth) so it can COPY schema/ and obleth/.
          - component: obleth-provisioner
            context: .
          - component: control-plane
            context: ./control-plane
          - component: benchmark-backend
            context: ./benchmark-backend
          # NOTE: this image is slow to build — the builder stage downloads and
          # bakes a ~600 MB ONNX model from Hugging Face.
          - component: obleth-kompress
            context: .
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.component }}:${{ github.ref_name }}-${{ matrix.arch }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

  # Merge the per-arch tags into one multi-arch manifest (:vX.Y.Z, plus
  # :latest for stable releases).
  manifest:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [obleth, obleth-provisioner, control-plane, benchmark-backend, obleth-kompress]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create multi-arch manifest
        run: |
          image="$REGISTRY/${{ matrix.component }}"
          tags=(-t "$image:$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) ;;  # prerelease: never move :latest
            *) tags+=(-t "$image:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "$image:$GITHUB_REF_NAME-amd64" \
            "$image:$GITHUB_REF_NAME-arm64"

  helm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package and push chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/k8s/obleth --version "$version" --app-version "$version"
          helm push "obleth-$version.tgz" oci://ghcr.io/thediymaker/charts

  release:
    needs: [manifest, helm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--verify-tag --title "obleth-gateway $GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          # Prefer the curated CHANGELOG.md section for this version; fall back to
          # auto-generated notes when there's no matching entry.
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## v$version" '
            $0 == v { f = 1; next }
            /^## v/ { if (f) exit }
            f { print }
          ' CHANGELOG.md)"
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes "${args[@]}"
          fi
