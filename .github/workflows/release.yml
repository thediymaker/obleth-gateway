name: release

# Pushing a vX.Y.Z tag publishes everything in lockstep: multi-arch images for
# the three components to GHCR, the Helm chart as an OCI artifact, and a
# GitHub Release. Prerelease tags (vX.Y.Z-rc.N) publish images + chart but
# skip the :latest tag and mark the release as a prerelease.
on:
  push:
    tags: ["v*.*.*"]

# Read-only by default; each publishing job requests only the write scope it
# needs (packages for images/chart, contents for the GitHub Release).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io/thediymaker/obleth-gateway

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: tag matches lockstep version
        run: bash scripts/check-versions.sh "$GITHUB_REF_NAME"

  build:
    needs: verify
    strategy:
      matrix:
        component: [obleth, obleth-provisioner, control-plane, benchmark-backend, obleth-compressor]
        # Native runners for both arches — never QEMU (Rust under emulation
        # takes 30-60 min per image).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - component: obleth
            context: .
          # The provisioner Dockerfile expects the repo root as its build context
          # (same as obleth) so it can COPY schema/ and obleth/.
          - component: obleth-provisioner
            context: .
          - component: control-plane
            context: ./control-plane
          - component: benchmark-backend
            context: ./benchmark-backend
          # NOTE: this image is slow to build — the builder stage downloads and
          # bakes a ~600 MB ONNX model from Hugging Face.
          - component: obleth-compressor
            context: .
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: deploy/docker/${{ matrix.component }}.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.component }}:${{ github.ref_name }}-${{ matrix.arch }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}

  # Merge the per-arch tags into one multi-arch manifest (:vX.Y.Z, plus
  # :latest for stable releases).
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        component: [obleth, obleth-provisioner, control-plane, benchmark-backend, obleth-compressor]
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create multi-arch manifest
        run: |
          image="$REGISTRY/${{ matrix.component }}"
          tags=(-t "$image:$GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) ;;  # prerelease: never move :latest
            *) tags+=(-t "$image:latest") ;;
          esac
          docker buildx imagetools create "${tags[@]}" \
            "$image:$GITHUB_REF_NAME-amd64" \
            "$image:$GITHUB_REF_NAME-arm64"

  # Publish the chart only after every image manifest exists, so the chart
  # never points at image tags that failed to build.
  helm:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: package and push chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          version="${GITHUB_REF_NAME#v}"
          helm package deploy/k8s/obleth --version "$version" --app-version "$version"
          helm push "obleth-$version.tgz" oci://ghcr.io/thediymaker/charts

  release:
    needs: [manifest, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--verify-tag --title "obleth-gateway $GITHUB_REF_NAME")
          case "$GITHUB_REF_NAME" in
            *-*) args+=(--prerelease) ;;
          esac
          # Prefer the curated CHANGELOG.md section for this version; fall back to
          # auto-generated notes when there's no matching entry.
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v v="## v$version" '
            $0 == v { f = 1; next }
            /^## v/ { if (f) exit }
            f { print }
          ' CHANGELOG.md)"
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes "${args[@]}"
          fi
