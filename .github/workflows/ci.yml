name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lockstep version check
        run: bash scripts/check-versions.sh

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obleth
          POSTGRES_PASSWORD: obleth
          POSTGRES_DB: obleth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obleth" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      OBLETH_TEST_DATABASE_URL: postgres://obleth:obleth@localhost:5432/obleth_test
      OBLETH_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: obleth
      - name: fmt
        working-directory: obleth
        run: cargo fmt --check
      - name: clippy
        working-directory: obleth
        run: cargo clippy --workspace --all-targets
      - name: test
        working-directory: obleth
        run: cargo test --workspace

  benchmark-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmark-backend
      - name: fmt
        working-directory: benchmark-backend
        run: cargo fmt --check
      - working-directory: benchmark-backend
        run: cargo build --release

  obench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: obench
      - name: fmt
        working-directory: obench
        run: cargo fmt --check
      - working-directory: obench
        run: cargo test
      - working-directory: obench
        run: cargo build --release

  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: control-plane
        run: npm install --no-audit --no-fund
      - working-directory: control-plane
        run: npm run build

  compressor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install test deps
        run: pip install fastapi "uvicorn[standard]" pydantic pytest httpx
      - name: test
        working-directory: compressor
        run: python -m pytest -q
