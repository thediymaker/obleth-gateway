name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: lockstep version check
        run: bash scripts/check-versions.sh
      - name: chart and Compose give ClickHouse the same config
        run: bash scripts/check-clickhouse-config.sh

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obleth
          POSTGRES_PASSWORD: obleth
          POSTGRES_DB: obleth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obleth" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      OBLETH_TEST_DATABASE_URL: postgres://obleth:obleth@localhost:5432/obleth_test
      OBLETH_TEST_REDIS_URL: redis://localhost:6379
      # The object store tests' bucket (SeaweedFS, started below).
      OBLETH_TEST_S3_BUCKET: obleth-test
      OBLETH_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      OBLETH_TEST_S3_ACCESS_KEY_ID: obleth-test
      OBLETH_TEST_S3_SECRET_ACCESS_KEY: obleth-test-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          # Matches rust-toolchain.toml and the builder images (rust:1.95-slim).
          toolchain: "1.95"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: obleth
      - name: fmt
        working-directory: obleth
        run: cargo fmt --check
      - name: clippy
        working-directory: obleth
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: object store for the batch tests
        run: |
          printf '%s' '{"identities":[{"name":"ci","credentials":[{"accessKey":"obleth-test","secretKey":"obleth-test-secret"}],"actions":["Admin","Read","Write","List"]}]}' > "$RUNNER_TEMP/s3.json"
          docker run -d --name s3 -p 8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" \
            chrislusf/seaweedfs:4.54 server -s3 -s3.config=/etc/s3.json -dir=/data \
            -volume.max=100 -master.volumeSizeLimitMB=64
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8333/ && break; sleep 1; done
          curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user obleth-test:obleth-test-secret http://127.0.0.1:8333/obleth-test
      - name: test
        working-directory: obleth
        run: cargo test --locked --workspace

  benchmark-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.95"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: benchmark-backend
      - name: fmt
        working-directory: benchmark-backend
        run: cargo fmt --check
      - working-directory: benchmark-backend
        run: cargo check --locked

  obench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.95"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: obench
      - name: fmt
        working-directory: obench
        run: cargo fmt --check
      - working-directory: obench
        run: cargo test --locked

  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - working-directory: control-plane
        run: npm ci --no-audit --no-fund
      - working-directory: control-plane
        run: npm test
      - working-directory: control-plane
        run: npm run build

  compressor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install test deps
        # The serving deps with requirements.txt's bounds, plus the test tools;
        # not the full requirements (no onnxruntime: the tests stub the model).
        run: pip install "fastapi>=0.111,<1.0" "uvicorn[standard]>=0.30,<1.0" "pydantic>=2.7,<3.0" "pytest>=8,<10" "httpx>=0.27,<1.0"
      - name: test
        working-directory: compressor
        run: python -m pytest -q
