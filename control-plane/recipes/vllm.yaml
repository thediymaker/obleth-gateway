# vLLM — high-throughput PagedAttention serving.
#
# Recipes are admin-authored: edit this file (or drop new *.yaml here) to change
# the backends the launch wizard offers. The directory is configurable with
# OBLETH_RECIPES_DIR (default: control-plane/recipes/).
id: vllm
label: Generic
badge: ""
backend: vllm
hint: High-throughput PagedAttention serving
health_path: /health
order: 10
model_placeholder: Qwen/Qwen3-8B
model_hint: HuggingFace model ID passed to vllm serve.
image_placeholder: /shared/images/vllm.sif

# The launch command obleth runs (inside the apptainer image, or bare-metal when
# the image is left blank). `executable` is the binary/launcher; set it to an
# absolute path if vllm isn't on PATH.
command:
  executable: vllm
  prefix_args: ["serve"]      # vllm serve <model>
  port_flag: "--port"
  # When the upstream name differs from the model, register it as a served alias.
  served_name_flag: "--served-model-name"

params:
  - id: tensor_parallel
    label: Tensor parallel size
    kind: number
    default: "1"
    min: 1
    max: 8
    step: 1
    hint: GPUs to shard the model across (1 = single GPU).
    advanced: true
    arg: { flag: "--tensor-parallel-size", omit_when: ["1"] }
  - id: max_model_len
    label: Max model length
    kind: number
    default: ""
    placeholder: model default
    advanced: true
    arg: { flag: "--max-model-len" }
  - id: gpu_memory_utilization
    label: GPU memory utilization
    kind: text
    default: ""
    placeholder: "0.90"
    advanced: true
    arg: { flag: "--gpu-memory-utilization" }
  - id: dtype
    label: Dtype
    kind: select
    default: auto
    options:
      - { value: auto, label: auto }
      - { value: bfloat16, label: bfloat16 }
      - { value: float16, label: float16 }
    advanced: true
    arg: { flag: "--dtype", omit_when: ["auto"] }
  - id: extra_args
    label: Extra args
    kind: text
    default: ""
    placeholder: "--enable-prefix-caching"
    advanced: true
    arg: { raw: true }
