# llama.cpp on GH200 (Grace-Hopper) — example of a fully admin-tuned recipe.
#
# Demonstrates the Open OnDemand-style knobs the wizard exposes:
#   * `command.executable` — an absolute path to a native (module-loaded) build,
#     no container required (leave the image blank in the wizard).
#   * `preamble` — shell run before launch (load modules, set up the env).
#   * defaults pre-tuned for a GH200's unified Grace+Hopper memory.
#
# Pair this with CPUs/Memory in the wizard (e.g. 72 CPUs, 560G) — those go to
# slurmrestd as structured fields, not #SBATCH lines.
id: llamacpp-gh200
label: llama.cpp (GH200)
badge: Grace-Hopper
hint: Native llama.cpp tuned for GH200 unified memory
health_path: /health
order: 31
model_label: GGUF model path
model_placeholder: /shared/models/glm-5.2.gguf
model_hint: Path to the .gguf file passed to llama-server -m.
image_placeholder: leave blank for native (module-loaded) llama-server
image_hint: This recipe runs bare-metal; leave the apptainer image empty.
image_optional: true

# Loaded before the server starts. Adjust module names to your site.
preamble: |
  module load cuda
  module load llama.cpp

command:
  executable: /opt/llama.cpp/bin/llama-server
  model_flag: "-m"
  fixed_args: ["--host", "0.0.0.0"]
  port_flag: "--port"
  alias_flag: "--alias"

params:
  - id: ngl
    label: GPU layers (-ngl)
    kind: number
    default: "99"
    arg: { flag: "-ngl" }
  - id: ctx_size
    label: Context size
    kind: number
    default: "1048576"
    hint: GH200's coherent memory lets you reserve a very large KV cache.
    arg: { flag: "--ctx-size" }
  - id: n_cpu_moe
    label: CPU MoE layers (--n-cpu-moe)
    kind: number
    default: "68"
    hint: Keep expert tensors of N layers on the Grace CPU to fit a large MoE model.
    arg: { flag: "--n-cpu-moe", omit_when: ["0"] }
  - id: cache_type
    label: KV cache type
    kind: select
    default: q8_0
    options:
      - { value: f16, label: f16 (full) }
      - { value: q8_0, label: q8_0 (smaller) }
      - { value: q4_0, label: q4_0 (smallest) }
    arg: { flags: ["--cache-type-k", "--cache-type-v"], omit_when: ["f16"] }
  - id: unified_memory
    label: CUDA unified memory
    kind: boolean
    default: "true"
    hint: Let GPU allocations spill into the Grace CPU's coherent LPDDR.
    arg: { env: GGML_CUDA_ENABLE_UNIFIED_MEMORY, env_value: "1" }
  - id: parallel
    label: Parallel slots
    kind: number
    default: "2"
    advanced: true
    arg: { flag: "--parallel", omit_when: ["1"] }
  - id: flash_attn
    label: Flash attention
    kind: boolean
    default: "true"
    advanced: true
    arg: { switch: "--flash-attn", switch_value: "on" }
  - id: jinja
    label: Jinja chat template
    kind: boolean
    default: "true"
    advanced: true
    arg: { switch: "--jinja" }
  - id: no_mmap
    label: Disable mmap (--no-mmap)
    kind: boolean
    default: "true"
    hint: Sequential read instead of mmap; faster on a network filesystem.
    advanced: true
    arg: { switch: "--no-mmap" }
  - id: extra_args
    label: Extra args
    kind: text
    default: ""
    placeholder: "--temp 1.0 --top-p 0.95"
    advanced: true
    arg: { raw: true }
